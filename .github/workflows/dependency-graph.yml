# Not generated by sbt-github-actions: GitHub's dependency graph can't read build.sbt,
# so this submits the resolved dependencies for Dependabot alerts.
name: Dependency Graph

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    name: Submit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java (temurin@17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Submit dependency graph
        uses: scalacenter/sbt-dependency-submission@v3
        with:
          modules-ignore: spoiwo-examples_3 spoiwo-examples_2.13
          configs-ignore: test scala-tool scala-doc-tool
